spring:
  profiles:
    active: local

  application:
    name: Bridge

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  token:
    secret: ${JWT_SECRET_KEY}
    expiration:
      access: 3600000       # 1시간
      refresh: 1209600000   # 14일

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_S3_REGION:ap-northeast-2}
      access-key: ${AWS_ACCESS_KEY:}     # 비우면 IAM Role(DefaultCredentialsProvider) 사용
      secret-key: ${AWS_SECRET_KEY:}
      presigned-get-expiration-seconds: 3600  # 1시간
      max-file-size-bytes: 10485760           # 10MB
