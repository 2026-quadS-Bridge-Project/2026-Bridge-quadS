spring:
  profiles:
    active: local # 기본적으로 local 프로필을 활성화

  application:
    name: Bridge

  # 기존 Gemini 설정 유지
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash

  # 기존 파일 업로드 설정 유지
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  token:
    secret: ${JWT_SECRET_KEY}
    expiration:
      access: 3600000       # 1시간
      refresh: 1209600000   # 14일

