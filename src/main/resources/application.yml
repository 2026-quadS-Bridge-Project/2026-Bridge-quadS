spring:
  profiles:
    active: prod

  application:
    name: Bridge

  # 기존 Gemini 설정 유지
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash

  # 기존 파일 업로드 설정 유지
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:postgresql://db:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

jwt:
  token:
    secret: ${JWT_SECRET_KEY}
    expiration:
      access: 3600000       # 1시간
      refresh: 1209600000   # 14일


cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_S3_REGION:ap-northeast-2}
      access-key: ${AWS_ACCESS_KEY:}     # 비우면 IAM Role(DefaultCredentialsProvider) 사용
      secret-key: ${AWS_SECRET_KEY:}
      presigned-get-expiration-seconds: 3600  # 1시간
      max-file-size-bytes: 10485760           # 10MB