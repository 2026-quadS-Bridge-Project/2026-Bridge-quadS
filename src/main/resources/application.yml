spring:
  profiles:
    active: local # 기본적으로 local 프로필을 활성화

  application:
    name: Bridge

  # 기존 Gemini 설정 유지
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash

  # 기존 파일 업로드 설정 유지
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true